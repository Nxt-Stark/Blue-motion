<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .gradient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    mix-blend-mode: screen;
    animation: float 20s ease-in-out infinite;
  }

  .orb1 {
    width: 600px;
    height: 600px;
    background: rgb(59, 130, 246);
    top: 20%;
    left: 25%;
    animation-delay: 0s;
  }

  .orb2 {
    width: 500px;
    height: 500px;
    background: rgb(96, 165, 250);
    top: 40%;
    right: 25%;
    animation-delay: -5s;
  }

  .orb3 {
    width: 400px;
    height: 400px;
    background: rgb(147, 197, 253);
    bottom: 20%;
    left: 35%;
    animation-delay: -10s;
  }

  .content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    z-index: 1;
    animation: fadeIn 2s ease-out;
  }

  .title {
    font-size: 80px;
    font-weight: bold;
    margin: 0;
    letter-spacing: 2px;
    background: linear-gradient(to right, #fff, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 24px;
    color: rgba(255, 255, 255, 0.8);
    margin-top: 10px;
  }

  .lines {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .line {
    position: absolute;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(59, 130, 246, 0.5), transparent);
    animation: slide 8s linear infinite;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(5%, 5%) scale(1.1); }
    50% { transform: translate(-5%, 10%) scale(0.9); }
    75% { transform: translate(10%, -5%) scale(1.05); }
  }

  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translate(-50%, -40%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="gradient-orb orb1"></div>
    <div class="gradient-orb orb2"></div>
    <div class="gradient-orb orb3"></div>
    
    <div class="lines">
      <div class="line" style="top: 20%; width: 60%; left: -10%;"></div>
      <div class="line" style="top: 40%; width: 80%; left: -20%; animation-delay: -2s;"></div>
      <div class="line" style="top: 60%; width: 70%; left: -15%; animation-delay: -4s;"></div>
      <div class="line" style="top: 80%; width: 90%; left: -25%; animation-delay: -6s;"></div>
    </div>

    <div class="content">
      <h1 class="title">MOTION</h1>
      <p class="subtitle">Fluid • Dynamic • Design</p>
    </div>
  </div>
</body>
</html>
